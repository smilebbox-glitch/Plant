server {
  listen 80;
  server_name _;
  charset utf-8;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/html application/javascript text/css;
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /vendor/ { add_header Cache-Control "public, max-age=2592000"; }
}
